# Keep Gradle's memory use modest enough to coexist with the Android emulator.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC

# Keep the daemon ON for faster subsequent builds
org.gradle.daemon=true

# Standard modern Android settings
android.useAndroidX=true
android.enableJetifier=false

# Limit concurrency to avoid starving the JVM/native toolchain on 16 GB machines.
org.gradle.parallel=false
org.gradle.workers.max=2
org.gradle.caching=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
